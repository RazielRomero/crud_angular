services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - angular_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      - NG_CLI_ANALYTICS=false
    stdin_open: true
    tty: true
    command: npx ng serve --host 0.0.0.0 --port 4200

volumes:
  angular_modules:
